defaults:
  - hybrid_engines/fsdp@actor.fsdp_config
  - _self_
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:REPO_PATH}/examples/offline_rl/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: sft
  logger:
    log_path: ${oc.env:RECAP_RUN_DIR}
    project_name: piper-recap
    experiment_name: piper_recap_cfg
    logger_backends: [tensorboard]
  max_epochs: 2000
  max_steps: 2000
  val_check_interval: -1
  save_interval: 100
  resume_dir: null

data:
  num_workers: 0
  advantage_tag: piper_recap_adv_v1
  balance_dataset_weights: true
  seed: 42
  train_data_paths:
    - dataset_path: ${oc.env:RECAP_DATASET}
      type: rollout
      weight: 1.0

algorithm:
  adv_type: gae

actor:
  group_name: ActorGroup
  training_backend: fsdp
  # Keep global_batch_size == micro_batch_size x GPUs. Gradient accumulation (global > micro x GPUs)
  # fails in FSDP no_shard with "Cannot writeback when the parameter shape changes".
  micro_batch_size: 4
  global_batch_size: 4
  seed: 42
  model:
    model_type: cfg_model
    precision: bf16
    model_path: ${oc.env:RECAP_PI05_TORCH_DIR}
    is_lora: false
    recap_lora_only: true
    # true (with recap_lora_only: false, openpi.train_expert_only: false) trains
    # the whole model in FP32 master weights; see README section 9.8.
    recap_full_finetune: false
    # Recorded in piper_recap_policy.json; serving picks the matching config.
    piper_policy_mode: recap_cfg
    add_value_head: false
    openpi:
      config_name: pi05_piper_joint
      action_horizon: 50
      action_dim: 32
      action_env_dim: 14
      action_chunk: 10
      num_images_in_input: 3
      num_steps: 10
      train_expert_only: true
      cfgrl_guidance_scale: 1.0
      # pi*0.6 / Evo-RL: negatives get "Advantage: negative", and 30% of all
      # samples drop the indicator (unconditional). round_001 used 0.1 / true
      # (negatives always unconditional); serve reads the value a checkpoint
      # was trained with from its piper_recap_policy.json.
      unconditional_prob: 0.3
      positive_only_conditional: false
      guidance_type: positive
    openpi_data:
      norm_stats_path: ${oc.env:RECAP_NORM_STATS}
      default_prompt: ${oc.env:RECAP_TASK}
  optim:
    lr: 1.0e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 1.0e-10
    clip_grad: 1.0
    lr_scheduler: cosine
    lr_warmup_steps: 100
    total_training_steps: 2000
    min_lr: 0.0
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    use_orig_params: true
    gradient_checkpointing: true
    # Keep no_shard: OpenPI's PaliGemmaWithExpertModel calls each layer's
    # projections directly instead of the decoder layer's forward, so
    # per-layer full_shard units are never unsharded. Wrap targets are the
    # model's defaults minus lm_head, which Gemma ties to embed_tokens (a
    # separate unit would split the shared weight); the loss never uses it.
    wrap_policy:
      transformer_layer_cls_to_wrap:
        - GemmaDecoderLayer
        - SiglipVisionEmbeddings
        - GemmaRMSNorm
        - GemmaRotaryEmbedding
      no_split_names:
        - action_in_proj
        - action_out_proj
        - state_proj
        - action_time_mlp_in
        - action_time_mlp_out
        - time_mlp_in
        - time_mlp_out
    # No FSDP casting: OpenPI already stores the model in BF16 and keeps the
    # norms, vision patch/position embeddings and action/time projections in
    # FP32 on purpose (to_bfloat16_for_selected_params). FSDP mixed precision
    # would cast those FP32 parameters too (dtype errors in the projections),
    # and leaves BF16 views on frozen FP32 units that never run backward
    # ("Cannot writeback when the parameter shape changes" at step 2).
    mixed_precision:
      param_dtype: null
      reduce_dtype: null
      buffer_dtype: null

reward:
  use_reward_model: false
critic:
  use_critic_model: false
